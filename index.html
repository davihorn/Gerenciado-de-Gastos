
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style/style.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>
</head>
<body>

<div class="container">

<h1> Finance Dashboard</h1>

<div class="cards">

<div class="card">
<h2>Total Geral</h2>
<p id="totalGeral">R$ 0,00</p>
</div>

<div class="card">
<h2>Quantidade</h2>
<p id="quantidade">0</p>
</div>
 


</div>

<form id="expenseForm">

<input type="text" id="descricao" placeholder="Descrição" required>

<input type="text" id="valor" placeholder="Valor R$" required>

<input type="date" id="data" required>

<select id="categoria" required>
<option value="">Categoria</option>
<option>Alimentação</option>
<option>Transporte</option>
<option>Moradia</option>
<option>Lazer</option>
<option>Outros</option>
</select>

<button type="submit">Adicionar</button>

</form>

<table>

<thead>
<tr>
<th>Descrição</th>
<th>Categoria</th>
<th>Valor</th>
<th>Data</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="listaGastos"></tbody>

</table>

<div class="dashboard">

<div class="chart-box">
<canvas id="graficoPizza"></canvas>
</div>

<div class="chart-box">

<h2>📌 Gastos Mensais</h2>

<div class="fixo-form">
<input type="text" id="nomeFixo" placeholder="Ex: Luz, Internet">
<input type="text" id="valorFixo" placeholder="R$ 0,00">
<button onclick="addFixo()">+</button>
</div>

<div class="lista-fixos" id="listaFixos"></div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script/script.js"></script>

</body>
</html>
