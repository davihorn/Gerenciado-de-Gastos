<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard Premium</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
}


.cards{
display:flex;
gap:20px;
margin-bottom:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:10px;
flex:1;
text-align:center;
}


form{
display:flex;
align-items:center;
gap:10px;
margin-bottom:20px;
}

form input,
form select{
height:40px;
padding:0 10px;
border-radius:6px;
border:none;
}

#descricao{
flex:2;
}

#valor{
flex:1.2;
}

#data{
flex:1.3;
}

#categoria{
flex:1.3;
}

form button{
height:40px;
padding:0 20px;
background:#3b82f6;
border:none;
color:white;
border-radius:6px;
cursor:pointer;
}


table{
width:100%;
border-collapse:collapse;
background:#1e293b;
}

th,td{
padding:10px;
text-align:center;
}

th{
background:#334155;
}

.delete-btn{
background:#ef4444;
border:none;
padding:6px 10px;
color:white;
border-radius:5px;
cursor:pointer;
}


.dashboard{
display:flex;
gap:20px;
margin-top:30px;
flex-wrap:wrap;
}

.chart-box{
background:#1e293b;
padding:20px;
border-radius:10px;
flex:1;
min-width:300px;
}


.fixo-form{
display:flex;
gap:10px;
margin-bottom:15px;
}

.fixo-form input{
flex:1;
height:35px;
padding:0 8px;
border-radius:5px;
border:none;
}

.lista-fixos{
display:flex;
flex-direction:column;
gap:10px;
}

.fixo-item{
display:flex;
justify-content:space-between;
align-items:center;
background:#0f172a;
padding:10px;
border-radius:6px;
}

.remover-fixo{
background:#ef4444;
border:none;
color:white;
padding:5px 8px;
border-radius:5px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<h1>💎 Finance Dashboard</h1>

<div class="cards">

<div class="card">
<h2>Total Geral</h2>
<p id="totalGeral">R$ 0,00</p>
</div>

<div class="card">
<h2>Quantidade</h2>
<p id="quantidade">0</p>
</div>

</div>

<form id="expenseForm">

<input type="text" id="descricao" placeholder="Descrição" required>

<input type="text" id="valor" placeholder="Valor R$" required>

<input type="date" id="data" required>

<select id="categoria" required>
<option value="">Categoria</option>
<option>Alimentação</option>
<option>Transporte</option>
<option>Moradia</option>
<option>Lazer</option>
<option>Outros</option>
</select>

<button type="submit">Adicionar</button>

</form>

<table>

<thead>
<tr>
<th>Descrição</th>
<th>Categoria</th>
<th>Valor</th>
<th>Data</th>
<th>Ação</th>
</tr>
</thead>

<tbody id="listaGastos"></tbody>

</table>

<div class="dashboard">

<div class="chart-box">
<canvas id="graficoPizza"></canvas>
</div>

<div class="chart-box">

<h2>📌 Gastos Mensais</h2>

<div class="fixo-form">
<input type="text" id="nomeFixo" placeholder="Ex: Luz, Internet">
<input type="text" id="valorFixo" placeholder="R$ 0,00">
<button onclick="addFixo()">+</button>
</div>

<div class="lista-fixos" id="listaFixos"></div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const form=document.getElementById("expenseForm");
const lista=document.getElementById("listaGastos");
const totalEl=document.getElementById("totalGeral");
const quantidadeEl=document.getElementById("quantidade");

let gastos=JSON.parse(localStorage.getItem("gastosPremium"))||[];
let fixos=JSON.parse(localStorage.getItem("gastosFixos"))||[];

let graficoPizza;

const cores=[
"#3b82f6","#6366f1","#8b5cf6",
"#ec4899","#f43f5e","#f59e0b",
"#10b981","#14b8a6"
];

function salvar(){
localStorage.setItem("gastosPremium",JSON.stringify(gastos));
}

function salvarFixos(){
localStorage.setItem("gastosFixos",JSON.stringify(fixos));
}

function formatarData(data){
const d=new Date(data);
return d.toLocaleDateString("pt-BR");
}

function formatarMoeda(valor){

valor = valor.replace(/\D/g,"");
valor = (valor/100).toFixed(2)+"";
valor = valor.replace(".",",");
valor = valor.replace(/\B(?=(\d{3})+(?!\d))/g,".");

return "R$ "+valor;

}

function atualizar(){

lista.innerHTML="";
let total=0;

gastos.forEach((g,i)=>{

total+=parseFloat(g.valor);

lista.innerHTML+=`
<tr>
<td>${g.descricao}</td>
<td>${g.categoria}</td>
<td>R$ ${parseFloat(g.valor).toFixed(2).replace(".",",")}</td>
<td>${formatarData(g.data)}</td>
<td><button class="delete-btn" onclick="remover(${i})">X</button></td>
</tr>`;

});

totalEl.innerText="R$ "+total.toFixed(2).replace(".",",");
quantidadeEl.innerText=gastos.length;

atualizarGraficos();

}

function remover(i){
gastos.splice(i,1);
salvar();
atualizar();
}

form.addEventListener("submit",e=>{

e.preventDefault();

const valorNumerico=document.getElementById("valor").value.replace(/\D/g,"")/100;

gastos.push({
descricao:descricao.value,
valor:valorNumerico,
data:data.value,
categoria:categoria.value
});

salvar();
atualizar();
form.reset();

});

function atualizarGraficos(){

const categorias={};

gastos.forEach(g=>{
categorias[g.categoria]=(categorias[g.categoria]||0)+parseFloat(g.valor);
});

const labels=Object.keys(categorias);
const valores=Object.values(categorias);

if(graficoPizza)graficoPizza.destroy();

graficoPizza=new Chart(document.getElementById("graficoPizza"),{

type:'doughnut',

data:{
labels:labels,
datasets:[{
data:valores,
backgroundColor:cores
}]
},

options:{
responsive:true,
plugins:{
legend:{labels:{color:"white"}}
}
}

});

}

/* GASTOS FIXOS */

function addFixo(){

const nome=document.getElementById("nomeFixo").value;
const valor=document.getElementById("valorFixo").value.replace(/\D/g,"")/100;

if(!nome || !valor) return;

fixos.push({nome,valor});

salvarFixos();

document.getElementById("nomeFixo").value="";
document.getElementById("valorFixo").value="";

renderFixos();

}

function removerFixo(i){

fixos.splice(i,1);

salvarFixos();

renderFixos();

}

function renderFixos(){

const lista=document.getElementById("listaFixos");

lista.innerHTML="";

fixos.forEach((f,i)=>{

lista.innerHTML+=`
<div class="fixo-item">
<span>${f.nome} - R$ ${f.valor.toFixed(2).replace(".",",")}</span>
<button class="remover-fixo" onclick="removerFixo(${i})">X</button>
</div>
`;

});

}

["valor","valorFixo"].forEach(id=>{
const campo=document.getElementById(id);
campo.addEventListener("input",()=>{
campo.value=formatarMoeda(campo.value);
});
});

renderFixos();
atualizar();

</script>

</body>
</html>
